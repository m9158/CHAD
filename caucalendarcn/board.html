<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title data-i18n="title_board">广场 · CAU 中国留学生</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="中央大学中国留学生自由交流版块。选课、租房、打工、生活。" />
<link rel="stylesheet" href="styles.css" />
<style>
/* ============================================================
   게시판 v2 — 카드형 리스트
   원칙: 글자 크기는 3단계 (15 / 13 / 11.5). 카드 + 옅은 그림자.
   설명 문구 없음. 바로 콘텐츠
   ============================================================ */

.wrap{max-width:680px; padding:0 16px 64px;}

/* ---- 상단바: 로고 + 탭 + 계정 ---- */
.topnav-inner{padding:0 16px; gap:6px 0; flex-wrap:wrap;}
.brand{
  font-size:13px; font-weight:700; color:var(--ink); text-decoration:none;
  white-space:nowrap; padding:12px 0;
}
.tabs{gap:2px; margin-left:18px; flex:1; min-width:0; overflow:hidden;}
.tab-link{
  font-size:13px; padding:12px 10px; border-bottom:2px solid transparent;
  white-space:nowrap;
}
/* .nav-auth 는 styles.css 로 이동(reviews.html 과 공유) */

/* ---- 목록 머리 ---- */
.list-head{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:16px 0 10px;
}
.list-head h1{font-size:15px; font-weight:700; margin:0; letter-spacing:-.01em;}
.list-head .ko{font-size:11.5px; color:var(--ink-faint); font-weight:400; margin-left:6px;}
.list-head .acts{display:flex; gap:6px;}
.list-head button{font-size:12.5px; padding:6px 12px; border-radius:var(--radius-pill);}

/* ---- 글 목록 (카드형) ---- */
.post-row{
  display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left;
  background:var(--paper-raised); border:0; border-radius:var(--radius); box-shadow:var(--shadow);
  padding:13px 14px; margin-bottom:10px; cursor:pointer;
}
.post-row:hover{box-shadow:var(--shadow-md);}
.post-row:active{transform:scale(.99);}
.badge{
  flex:0 0 auto; width:34px; height:34px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:700; color:#fff; background:var(--navy);
}
.badge.mine{background:var(--accent);}
.row-main{flex:1; min-width:0; display:flex; flex-direction:column;}
.post-row .t{
  display:block; font-size:14.5px; font-weight:700; line-height:1.4;
  color:var(--ink); word-break:break-word;
}
.post-row .p{
  display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; line-clamp:1;
  overflow:hidden; font-size:12.5px; color:var(--ink-soft); line-height:1.5;
  margin-top:3px; word-break:break-all;
}
.row-meta{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  margin-top:7px; font-size:11.5px; color:var(--ink-faint);
  font-variant-numeric:tabular-nums;
}
.row-meta .who{font-weight:600; color:var(--ink-soft);}
.row-stat{display:inline-flex; align-items:center; gap:3px;}
.row-stat.on{color:var(--accent);}
.meta{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  margin-top:6px; font-size:11px; color:var(--ink-faint);
  font-variant-numeric:tabular-nums;
}
.meta b{font-weight:400; color:var(--ink-soft);}
.meta .s{display:inline-flex; align-items:center; gap:3px;}
.meta .s.on{color:var(--accent);}
.ic{display:block;}

.state{font-size:13px; color:var(--ink-faint); padding:40px 2px; text-align:center; line-height:1.9;}
.more-wrap{padding-top:6px; text-align:center;}
.more-wrap button{font-size:12.5px; padding:7px 18px; border-radius:var(--radius-pill);}

/* ---- 상세 ---- */
.back{
  background:none; border:0; border-radius:0; padding:14px 0 10px;
  font-size:12.5px; color:var(--ink-soft);
}
.back:hover{color:var(--ink); background:none; border-color:transparent;}
.d-title{font-size:17px; font-weight:700; line-height:1.4; margin:0; word-break:break-word;}
.d-body{
  font-size:14.5px; line-height:1.8; white-space:pre-wrap; word-break:break-word;
  padding:14px 0 18px;
}
.d-acts{display:flex; gap:6px; flex-wrap:wrap; padding-bottom:16px;}
.d-acts button{font-size:12.5px; padding:6px 14px; border-radius:var(--radius-pill);}
.like.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink);}

/* ---- 댓글 ---- */
.c-head{
  font-size:12.5px; color:var(--ink-soft); font-weight:600;
  padding:12px 0 2px; border-top:1px solid var(--line);
}
.c-item{padding:12px 2px; border-top:1px solid var(--line);}
.c-item:first-of-type{border-top:0;}
.c-who{font-size:12.5px; font-weight:600;}
.c-who.op{color:var(--accent);}
.c-body{font-size:14px; line-height:1.65; margin-top:3px; white-space:pre-wrap; word-break:break-word;}
.c-foot{display:flex; gap:10px; margin-top:5px; font-size:11.5px; color:var(--ink-faint);}
.c-foot button{
  background:none; border:0; border-radius:0; padding:0;
  font-size:11.5px; color:var(--ink-faint);
}
.c-foot button:hover{color:var(--ink-soft); background:none; border-color:transparent;}

.c-form{display:flex; gap:6px; align-items:flex-end; padding-top:14px; border-top:1px solid var(--line);}
.c-form textarea{
  flex:1; font:inherit; font-size:14px; padding:9px 11px; border-radius:var(--radius-sm);
  border:1px solid var(--line); background:var(--paper); color:var(--ink);
  min-height:40px; max-height:160px; resize:vertical;
}
.c-form textarea:focus{outline:2px solid var(--focus); outline-offset:1px;}
.c-form button{padding:9px 16px; border-radius:var(--radius-pill); font-size:13px;}

/* ---- 작성 폼 (카드) ---- */
.write{
  background:var(--paper-raised); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:16px; margin:14px 0;
}
.write[hidden]{display:none;}
.write input, .write textarea{
  width:100%; font:inherit; padding:9px 11px; border-radius:var(--radius-sm);
  border:1px solid var(--line); background:var(--paper); color:var(--ink);
  margin-bottom:8px;
}
.write input{font-size:15px; font-weight:600;}
.write textarea{font-size:14px; min-height:130px; resize:vertical;}
.write input:focus, .write textarea:focus{outline:2px solid var(--focus); outline-offset:1px;}
.w-foot{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.w-foot .count{font-size:11.5px; color:var(--ink-faint); margin-left:auto;}
.w-foot button{font-size:13px; padding:8px 16px; border-radius:var(--radius-pill);}
.chk{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-soft);}
.chk input{width:14px; height:14px; accent-color:var(--accent); margin:0;}
.err{color:var(--gold); font-size:12px; margin-bottom:8px;}
.err[hidden]{display:none;}
.msg{font-size:12.5px; color:var(--ink-soft);}

/* .backdrop/.sheet/.switch/.ko-sub 는 styles.css 로 이동(reviews.html 과 공유) */

/* ---- 기타 ---- */
footer{
  margin-top:32px; padding-top:14px; border-top:1px solid var(--line);
  font-size:11.5px; color:var(--ink-faint); line-height:1.7;
}
.config-banner{border-radius:var(--radius-sm); font-size:12.5px; padding:10px 12px;}

@media (max-width:560px){
  .brand{font-size:12px;}
  .tabs{margin-left:10px;}
  .tab-link{padding:12px 7px; font-size:12px;}
  .nav-auth .who{display:none;}
}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

<nav class="topnav">
  <div class="topnav-inner">
    <a class="brand" href="index.html"><span class="brand-cau">CAU</span> <span class="brand-name" data-i18n="brand_name">中国留学生</span></a>
    <div class="tabs">
      <a href="index.html"   class="tab-link"><svg class="tab-ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span data-i18n="tab_cal">日历</span></a>
      <a href="reviews.html" class="tab-link"><svg class="tab-ic" viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.6-4.6 4.1 1.3 6-5.4-3.1-5.4 3.1 1.3-6-4.6-4.1 6.1-.6z"/></svg><span data-i18n="tab_rev">点评</span></a>
      <a href="board.html"   class="tab-link active"><svg class="tab-ic" viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg><span data-i18n="tab_board">广场</span></a>
    </div>
    <div class="nav-auth">
      <span class="who" id="who"></span>
      <button id="loginBtn" data-i18n="login" hidden>登录</button>
      <button id="logoutBtn" data-i18n="logout" hidden>退出</button>
    </div>
  </div>
</nav>

<div class="wrap">

  <p class="config-banner" id="configBanner" hidden></p>

  <!-- ================= 목록 ================= -->
  <section id="listView">
    <div class="list-head">
      <h1 data-i18n="board_h1">广场</h1>
      <div class="acts">
        <button id="refreshBtn" data-i18n="refresh">刷新</button>
        <button class="btn-primary" id="openWriteBtn" data-i18n="write_post">写帖子</button>
      </div>
    </div>

    <section class="write" id="writePanel" hidden>
      <form id="postForm" novalidate>
        <input type="text" id="postTitle" maxlength="100" autocomplete="off" data-i18n-ph="title_ph" required />
        <textarea id="postBody" maxlength="5000" data-i18n-ph="body_ph" required></textarea>
        <div class="err" id="postErr" hidden></div>
        <div class="w-foot">
          <label class="chk"><input type="checkbox" id="postAnon" checked /> <span data-i18n="anon">匿名</span></label>
          <button type="submit" class="btn-primary" id="postSubmit" data-i18n="publish">发布</button>
          <button type="button" id="postCancel" data-i18n="cancel">取消</button>
          <span class="msg" id="postStatus"></span>
          <span class="count"><span id="bodyCount">0</span>/5000</span>
        </div>
      </form>
    </section>

    <div id="postList"><div class="state" data-i18n="loading">加载中…</div></div>

    <div class="more-wrap" id="moreWrap" hidden><button id="moreBtn" data-i18n="more">加载更多</button></div>
  </section>

  <!-- ================= 상세 ================= -->
  <section id="detailView" hidden>
    <button class="back" id="backBtn" data-i18n="back">← 返回</button>
    <div id="detailContent"></div>
  </section>

  <footer data-i18n-html="board_footer"></footer>
  <p class="qna-link"><a href="qna.html" data-i18n="qna_link">意见反馈 · 问答</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="i18n.js"></script>
<script src="auth.js"></script>
<script>
(function () {
  "use strict";

  const PAGE_SIZE = 20;
  const $ = (id) => document.getElementById(id);
  const t = (...a) => I18N.t(...a);

  if (!window.CAUAuth) return;
  const sb = CAUAuth.getClient();
  if (!sb) return;

  let session = null, myLikes = new Set, offset = 0, loading = false, currentPost = null;

  // ---------- 아이콘 ----------
  const ICON_HEART = (fill) =>
    '<svg class="ic" width="12" height="12" viewBox="0 0 16 16" aria-hidden="true">' +
    '<path d="M8 13.6C8 13.6 2 10.2 2 6.3 2 4.5 3.4 3.2 5.1 3.2 6.3 3.2 7.4 3.9 8 4.9 8.6 3.9 9.7 3.2 10.9 3.2 12.6 3.2 14 4.5 14 6.3 14 10.2 8 13.6 8 13.6Z" ' +
    'fill="' + (fill ? "currentColor" : "none") + '" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>';
  const ICON_CHAT =
    '<svg class="ic" width="12" height="12" viewBox="0 0 16 16" aria-hidden="true">' +
    '<path d="M2.6 3.4h10.8v7.2h-6L4.2 13v-2.4H2.6z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>';

  // ---------- 유틸 ----------
  const esc = (s) => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

  function timeAgo(iso) {
    const d = (Date.now() - new Date(iso).getTime()) / 1000;
    if (d < 60) return t("ago_now");
    if (d < 3600) return t("ago_min", Math.floor(d / 60));
    if (d < 86400) return t("ago_hour", Math.floor(d / 3600));
    if (d < 604800) return t("ago_day", Math.floor(d / 86400));
    const dt = new Date(iso);
    return (dt.getMonth() + 1) + "/" + dt.getDate();
  }
  const who = (r) => r.is_anonymous ? (r.is_mine ? t("anon_me") : t("anon_plain")) : (r.nickname || t("anon_plain"));
  const say = (el, m, bad) => { el.textContent = m || ""; el.style.color = bad ? "var(--gold)" : "var(--ink-soft)"; };

  const needLogin = CAUAuth.needLogin;

  // ---------- 목록 ----------
  const postList = $("postList");

  async function fetchMyLikes(ids) {
    if (!session || !ids.length) return;
    const { data } = await sb.from("post_likes").select("post_id").in("post_id", ids);
    (data || []).forEach((r) => myLikes.add(r.post_id));
  }

  const rowHTML = (p) => {
    const liked = myLikes.has(p.id);
    const initial = p.is_anonymous ? (p.is_mine ? t("badge_me") : t("badge_anon")) : esc((p.nickname || "?").charAt(0));
    const badgeCls = "badge" + (p.is_mine ? " mine" : "");
    return '<button class="post-row" data-id="' + p.id + '">' +
      '<span class="' + badgeCls + '">' + initial + "</span>" +
      '<span class="row-main">' +
        '<span class="t">' + esc(p.title) + "</span>" +
        '<span class="p">' + esc(p.body) + "</span>" +
        '<span class="row-meta">' +
          '<span class="who">' + esc(who(p)) + "</span>" +
          '<span>' + timeAgo(p.created_at) + "</span>" +
          '<span class="row-stat' + (liked ? " on" : "") + '">' + ICON_HEART(liked) + p.like_count + "</span>" +
          '<span class="row-stat">' + ICON_CHAT + p.comment_count + "</span>" +
        "</span>" +
      "</span></button>";
  };

  async function loadPosts(reset) {
    if (loading) return;
    loading = true;
    if (reset) { offset = 0; myLikes = new Set; postList.innerHTML = '<div class="state">' + esc(t("loading")) + "</div>"; }

    const { data, error } = await sb.from("posts_public")
      .select("id,title,body,is_anonymous,nickname,like_count,comment_count,created_at,is_mine")
      .order("created_at", { ascending: false })
      .range(offset, offset + PAGE_SIZE - 1);
    loading = false;

    if (error) {
      postList.innerHTML = '<div class="state">' + esc(t("load_fail")) + esc(error.message) + "</div>";
      return;
    }
    await fetchMyLikes(data.map((p) => p.id));
    if (reset) postList.innerHTML = "";
    if (!data.length && offset === 0) {
      postList.innerHTML = '<div class="state">' + esc(t("empty_posts")) + "</div>";
    } else {
      postList.insertAdjacentHTML("beforeend", data.map(rowHTML).join(""));
    }
    offset += data.length;
    $("moreWrap").hidden = data.length < PAGE_SIZE;
  }

  postList.addEventListener("click", (e) => {
    const r = e.target.closest(".post-row");
    if (r) location.hash = "#post-" + r.dataset.id;
  });
  $("moreBtn").addEventListener("click", () => loadPosts(false));
  $("refreshBtn").addEventListener("click", () => loadPosts(true));

  // ---------- 글쓰기 ----------
  const writePanel = $("writePanel");
  $("openWriteBtn").addEventListener("click", () => {
    if (!needLogin()) return;
    writePanel.hidden = !writePanel.hidden;
    if (!writePanel.hidden) $("postTitle").focus();
  });
  $("postCancel").addEventListener("click", () => {
    $("postForm").reset(); $("bodyCount").textContent = "0";
    $("postErr").hidden = true; say($("postStatus"), ""); writePanel.hidden = true;
  });
  $("postBody").addEventListener("input", (e) => { $("bodyCount").textContent = e.target.value.length; });

  $("postForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!needLogin()) return;
    const title = $("postTitle").value.trim(), body = $("postBody").value.trim();
    const err = $("postErr"), st = $("postStatus");
    err.hidden = true;
    if (!title || !body) {
      err.hidden = false;
      err.textContent = !title ? t("err_title") : t("err_body");
      return;
    }
    $("postSubmit").disabled = true; say(st, t("publishing"));
    const { error } = await sb.from("posts").insert({
      author_id: session.user.id, title, body, is_anonymous: $("postAnon").checked
    });
    $("postSubmit").disabled = false;
    if (error) return say(st, t("post_fail") + error.message, true);
    $("postForm").reset(); $("bodyCount").textContent = "0"; say(st, "");
    writePanel.hidden = true; loadPosts(true);
  });

  // ---------- 상세 ----------
  const detail = $("detailContent");

  const likeHTML = (liked, n) =>
    ICON_HEART(liked) + '<span style="margin-left:5px">' + esc(t("like")) + ' <span id="likeNum">' + n + "</span></span>";

  async function openPost(id) {
    $("listView").hidden = true; $("detailView").hidden = false;
    detail.innerHTML = '<div class="state">' + esc(t("loading")) + "</div>";

    const { data: p, error } = await sb.from("posts_public")
      .select("id,title,body,is_anonymous,nickname,like_count,comment_count,created_at,is_mine")
      .eq("id", id).maybeSingle();

    if (error || !p) {
      detail.innerHTML = '<div class="state">' + esc(t("post_gone")) + "</div>";
      return;
    }
    currentPost = p;

    if (session) {
      const { data: lk } = await sb.from("post_likes").select("post_id").eq("post_id", p.id);
      if (lk && lk.length) myLikes.add(p.id);
    }
    const liked = myLikes.has(p.id);

    detail.innerHTML =
      '<h1 class="d-title">' + esc(p.title) + "</h1>" +
      '<div class="meta"><b>' + esc(who(p)) + "</b><span>" + timeAgo(p.created_at) + "</span></div>" +
      '<div class="d-body">' + esc(p.body) + "</div>" +
      '<div class="d-acts">' +
        '<button class="like' + (liked ? " on" : "") + '" id="likeBtn">' + likeHTML(liked, p.like_count) + "</button>" +
        '<button id="reportBtn">' + esc(t("report")) + "</button>" +
        (p.is_mine ? '<button id="delBtn">' + esc(t("del")) + "</button>" : "") +
      "</div>" +
      '<div class="c-head">' + esc(t("comments")) + ' <span id="cmtNum">' + p.comment_count + "</span></div>" +
      '<div id="commentList"><div class="state">' + esc(t("loading")) + "</div></div>" +
      commentAreaHTML();

    $("likeBtn").addEventListener("click", toggleLike);
    $("reportBtn").addEventListener("click", () => report("post", p.id));
    if ($("delBtn")) $("delBtn").addEventListener("click", delPost);
    if ($("commentForm")) $("commentForm").addEventListener("submit", addComment);
    if ($("commentLoginBtn")) $("commentLoginBtn").addEventListener("click", () => CAUAuth.openAuth("login"));
    loadComments(p.id);
  }

  // 로그인한 사람에게만 댓글 입력칸을 보여준다. 로그인 전에는 안내 문구 + 로그인 버튼.
  function commentAreaHTML() {
    if (!session) {
      return '<div class="c-login"><span>' + esc(t("comment_login_prompt")) + "</span>" +
        '<button type="button" class="btn-primary" id="commentLoginBtn">' + esc(t("login")) + "</button></div>";
    }
    return '<form class="c-form" id="commentForm">' +
        '<textarea id="commentBody" maxlength="1000" placeholder="' + esc(t("comment_ph")) + '"></textarea>' +
        '<button type="submit" class="btn-primary" id="commentSubmit">' + esc(t("comment_send")) + "</button>" +
      "</form>" +
      '<div style="display:flex;align-items:center;gap:10px;margin-top:8px">' +
        '<label class="chk"><input type="checkbox" id="commentAnon" checked /> ' + esc(t("anon")) + "</label>" +
        '<span class="msg" id="commentStatus"></span></div>';
  }

  async function toggleLike() {
    if (!needLogin()) return;
    const id = currentPost.id, btn = $("likeBtn");
    const n = +$("likeNum").textContent;
    btn.disabled = true;
    if (myLikes.has(id)) {
      const { error } = await sb.from("post_likes").delete().eq("post_id", id).eq("user_id", session.user.id);
      if (!error) { myLikes.delete(id); btn.classList.remove("on"); btn.innerHTML = likeHTML(false, Math.max(n - 1, 0)); }
    } else {
      const { error } = await sb.from("post_likes").insert({ post_id: id, user_id: session.user.id });
      if (!error) { myLikes.add(id); btn.classList.add("on"); btn.innerHTML = likeHTML(true, n + 1); }
    }
    btn.disabled = false;
  }

  async function delPost() {
    if (!confirm(t("confirm_del_post"))) return;
    const { error } = await sb.from("posts").update({ is_deleted: true }).eq("id", currentPost.id);
    if (error) return alert(t("del_fail") + error.message);
    location.hash = ""; loadPosts(true);
  }

  async function report(type, id) {
    if (!needLogin()) return;
    const reason = prompt(t("report_prompt"));
    if (reason === null) return;
    const { error } = await sb.from("reports").insert({
      target_type: type, target_id: id, reporter_id: session.user.id, reason: reason || null
    });
    if (error) return alert(/duplicate|unique/i.test(error.message) ? t("report_dup") : t("report_fail") + error.message);
    alert(t("report_ok"));
  }

  // ---------- 댓글 ----------
  async function loadComments(postId) {
    const box = $("commentList");
    if (!box) return;
    const { data, error } = await sb.from("comments_public")
      .select("id,post_id,body,is_anonymous,nickname,anon_no,is_op,created_at,is_mine")
      .eq("post_id", postId).order("created_at", { ascending: true });

    if (error) { box.innerHTML = '<div class="state">' + esc(t("load_fail")) + esc(error.message) + "</div>"; return; }
    if (!data.length) { box.innerHTML = '<div class="state">' + esc(t("no_comments")) + "</div>"; return; }

    box.innerHTML = data.map((c) => {
      const name = (!c.is_anonymous && c.nickname) ? esc(c.nickname) : (c.is_op ? t("op") : t("anon_n", c.anon_no));
      return '<div class="c-item">' +
        '<span class="c-who' + (c.is_op ? " op" : "") + '">' + name + "</span>" +
        '<span style="font-size:11.5px;color:var(--ink-faint);margin-left:7px">' + timeAgo(c.created_at) + "</span>" +
        '<div class="c-body">' + esc(c.body) + "</div>" +
        '<div class="c-foot"><button data-rep="' + c.id + '">' + esc(t("report")) + "</button>" +
          (c.is_mine ? '<button data-del="' + c.id + '">' + esc(t("del")) + "</button>" : "") + "</div></div>";
    }).join("");

    box.querySelectorAll("[data-rep]").forEach((b) =>
      b.addEventListener("click", () => report("comment", +b.dataset.rep)));
    box.querySelectorAll("[data-del]").forEach((b) =>
      b.addEventListener("click", async () => {
        if (!confirm(t("confirm_del_comment"))) return;
        const { error } = await sb.from("comments").update({ is_deleted: true }).eq("id", +b.dataset.del);
        if (error) return alert(t("del_fail") + error.message);
        loadComments(postId);
      }));
  }

  async function addComment(e) {
    e.preventDefault();
    if (!needLogin()) return;
    const body = $("commentBody").value.trim(), st = $("commentStatus");
    if (!body) return say(st, t("err_comment"), true);
    $("commentSubmit").disabled = true; say(st, t("comment_sending"));
    const { error } = await sb.from("comments").insert({
      post_id: currentPost.id, author_id: session.user.id, body, is_anonymous: $("commentAnon").checked
    });
    $("commentSubmit").disabled = false;
    if (error) return say(st, t("comment_fail") + error.message, true);
    $("commentBody").value = ""; say(st, "");
    const n = $("cmtNum"); if (n) n.textContent = +n.textContent + 1;
    loadComments(currentPost.id);
  }

  // ---------- 라우팅 ----------
  function route() {
    const m = location.hash.match(/^#post-(\d+)$/);
    if (m) openPost(+m[1]);
    else { $("detailView").hidden = true; $("listView").hidden = false; currentPost = null; }
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  $("backBtn").addEventListener("click", () => { location.hash = ""; });

  // ---------- 시작 ----------
  CAUAuth.ready().then((s) => {
    session = s;
    loadPosts(true).then(route);
  });
  CAUAuth.onChange((s) => {
    session = s; myLikes = new Set;
    if (currentPost) openPost(currentPost.id); else loadPosts(true);
  });
  // 언어를 바꾸면 목록/상세를 새 언어로 다시 그린다(글·댓글 본문은 작성된 그대로).
  I18N.onChange(() => {
    $("postErr").hidden = true; say($("postStatus"), "");
    if (currentPost) openPost(currentPost.id); else loadPosts(true);
  });
})();
</script>
</body>
</html>
